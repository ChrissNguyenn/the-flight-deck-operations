name: Update Vietnam Weather

# Self-sustaining 60-second weather loop.
#
# GitHub throttles `schedule:` crons brutally (observed 1-3 h real gaps),
# so a run-per-minute design can't work. Instead ONE job runs a fetch/
# commit loop every 60 s for ~5h40m (under the 6 h job limit), and the
# half-hourly cron starts a fresh loop once the previous one has ended.
# Runs that find an older loop already going stand down immediately, so
# extra triggers (manual, or an external pinger) are harmless no-ops.

on:
  schedule:
    # Keep-alive + takeover queue; :07/:37 avoids the congested slots
    - cron: "7,37 * * * *"
  workflow_dispatch:            # manual start / instant restart

permissions:
  contents: write
  actions: read

# NO `concurrency:` block on purpose. GitHub cancels an already-PENDING
# run whenever a newer one joins the same concurrency group, so any
# external pinger firing faster than the queue drains would cancel the
# loop before it ever started. Single-instance is enforced below instead,
# by standing down if an older run of this workflow is already going.

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # hard stop under the 6 h job limit
    steps:
      - name: Stand down if a loop is already running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=${{ github.run_id }}
          # NB: parse with jq, not grep — the payload is full of nested
          # "id" fields (actor, repo, commit) whose values are smaller
          # than a run id, which would make every run stand down.
          others=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/weather.yml/runs?status=in_progress&per_page=50" \
            | jq -r '.workflow_runs[].id' || true)
          echo "this run: $mine"
          echo "in-progress runs: ${others:-none}"
          for id in $others; do
            if [ -n "$id" ] && [ "$id" -lt "$mine" ]; then
              echo "Run $id is already looping — this run stands down."
              echo "SKIP=1" >> $GITHUB_ENV
              break
            fi
          done

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip            # reuse installed deps — runs start faster

      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - name: Fetch weather every 60 s, commit only on change
        if: env.SKIP != '1'
        env:
          MET_BASE_URL: ${{ secrets.MET_BASE_URL }}
          MET_USERNAME: ${{ secrets.MET_USERNAME }}
          MET_PASSWORD: ${{ secrets.MET_PASSWORD }}
          TSN_MET_BASE: ${{ secrets.TSN_MET_BASE }}
          TSN_MET_USER: ${{ secrets.TSN_MET_USER }}
          TSN_MET_PASS: ${{ secrets.TSN_MET_PASS }}
        run: |
          git config user.name "acuro-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS + 20400))        # ~5h40m, exits before timeout
          radar_at=0
          while [ $SECONDS -lt $end ]; do
            iter=$SECONDS
            python fetch_weather_static.py || echo "::warning::fetch failed — retrying next minute"
            git add data/
            git diff --cached --quiet || git commit -m "wx update $(date -u '+%d %b %H:%MZ')"
            # push whatever is committed but not on origin yet (also picks
            # up code pushed meanwhile via the rebase)
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              if ! git pull --rebase origin main; then
                git rebase --abort 2>/dev/null || true
                git reset --hard origin/main   # drop local wx commit; next loop refetches
              fi
              git push origin HEAD:main || echo "::warning::push failed — retrying next change"
            fi

            # Radar/chart imagery every 5 min. It lives on the orphan branch
            # `wx-radar`, force-pushed as a SINGLE commit each time: these are
            # ~130 kB binaries refreshing all day, so keeping them on main
            # would add hundreds of MB of permanent history. Rebuilding the
            # branch from scratch keeps the mirror at its current size.
            if [ $((SECONDS - radar_at)) -ge 300 ] || [ $radar_at -eq 0 ]; then
              radar_at=$SECONDS
              rm -rf /tmp/radar && mkdir -p /tmp/radar
              if python fetch_radar_frames.py /tmp/radar; then
                rm -rf /tmp/rmirror
                git worktree remove --force /tmp/rmirror 2>/dev/null || true
                git worktree add --detach /tmp/rmirror >/dev/null 2>&1
                ( cd /tmp/rmirror
                  git checkout --orphan wx-radar >/dev/null 2>&1
                  git rm -rqf . >/dev/null 2>&1 || true
                  cp -r /tmp/radar/* .
                  git add -A
                  git -c user.name="acuro-weather-bot" \
                      -c user.email="actions@users.noreply.github.com" \
                      commit -qm "radar mirror $(date -u '+%d %b %H:%MZ')" || true
                  git push -qf origin wx-radar || echo "::warning::radar push failed"
                )
                git worktree remove --force /tmp/rmirror 2>/dev/null || true
              else
                echo "::warning::radar mirror failed — keeping previous frames"
              fi
            fi

            took=$((SECONDS - iter))
            [ $took -lt 60 ] && sleep $((60 - took))
          done
